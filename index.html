
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kflowers Ultra Gemoy 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:ital,wght@0,900;1,900&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fffcf5;
            --ink: #333;
            --soft-pink: #ffdae0;
            --cute-pink: #ff8fa3;
            --candy-blue: #bde0fe;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #ffeef0;
            background-image: 
                radial-gradient(#ffb6c1 0.5px, transparent 0.5px),
                radial-gradient(#ffb6c1 0.5px, #ffeef0 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Courier Prime', monospace;
            overflow-x: hidden;
            padding: 20px;
            /* Halaman diam, tidak ada rotasi 3d di body */
        }

        /* Custom Cursor */
        #cursor-flower {
            position: fixed;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 9999;
            font-size: 30px;
            transform: translate(-50%, -50%);
            display: none;
        }
        @media (min-width: 1024px) { #cursor-flower { display: block; } }

        /* Container Koran (STATIS/DIAM) */
        .newspaper-container {
            max-width: 1100px;
            margin: 40px auto;
            background: var(--paper);
            padding: 50px 30px;
            position: relative;
            box-shadow: 15px 15px 0px var(--ink);
            border: 3px solid var(--ink);
            /* Tidak ada transform di sini agar halaman tidak miring */
        }

        /* Header Bergoyang Lucu */
        .gazette-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3.5rem, 10vw, 7rem);
            text-align: center;
            text-transform: uppercase;
            color: var(--cute-pink);
            animation: wobbly 3s ease-in-out infinite;
            display: block;
            filter: drop-shadow(4px 4px 0px var(--ink));
        }

        @keyframes wobbly {
            0%, 100% { transform: rotate(-1deg); }
            50% { transform: rotate(1deg) scale(1.02); }
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            border-top: 3px solid var(--ink);
            border-bottom: 3px solid var(--ink);
            padding: 10px 0;
            margin: 20px 0 50px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        /* Product Cards (TILT TETAP AKTIF) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            position: relative;
            border: 3px solid var(--ink);
            transform-style: preserve-3d;
            cursor: pointer;
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 10px 10px 0px var(--cute-pink);
        }

        .image-box {
            width: 100%;
            height: 320px;
            overflow: hidden;
            border: 2px solid var(--ink);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img { transform: scale(1.1); }

        .price-tag {
            font-family: 'Fredoka', sans-serif;
            background: #ffecb3;
            color: var(--ink);
            padding: 5px 15px;
            border: 2px solid var(--ink);
            position: absolute;
            bottom: 20px;
            right: -10px;
            transform: rotate(5deg);
            font-weight: 600;
        }

        /* --- ANIMASI SOSIAL MEDIA (JELLY MODE) --- */
        .social-section {
            margin-top: 80px;
            text-align: center;
            padding: 40px;
            background: #fff;
            border: 3px dashed var(--cute-pink);
            border-radius: 20px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .social-btn {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 35px;
            text-decoration: none;
            color: var(--ink);
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            background: white;
            border: 3px solid var(--ink);
            border-radius: 50px;
            box-shadow: 0 8px 0 var(--ink);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Efek Jelly saat di-hover */
        .social-btn:hover {
            transform: translateY(-5px) scale(1.05);
            background: var(--soft-pink);
            box-shadow: 0 12px 0 var(--cute-pink);
        }

        .social-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--ink);
        }

        .social-btn span {
            display: inline-block;
            transition: transform 0.4s ease;
        }

        .social-btn:hover span {
            transform: rotate(360deg);
        }

        /* Floating Decorations */
        .petal {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        footer {
            margin-top: 50px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="cursor-flower">🌸</div>

    <div class="newspaper-container">
        <header>
            <h1 class="gazette-title">Kflowers</h1>
            <div class="sub-header">
                <span>VOL. 99 — 2026</span>
                <span>CANGKUANG DISTRICT</span>
                <span>♡ 100% HANDMADE ♡</span>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <div class="image-box">
                    <img src="https://i.pinimg.com/736x/74/58/dc/7458dce8dbb934ed0969df4f74d484fe.jpg" class="card-img">
                </div>
                <h3 style="margin-top:20px; font-family: 'Fredoka';">Rosé Bliss 🎀</h3>
                <div class="price-tag">34k</div>
            </div>

            <div class="card">
                <div class="image-box">
                    <img src="https://i.pinimg.com/1200x/ba/82/e8/ba82e8730f14db0aea193528da55977d.jpg" class="card-img">
                </div>
                <h3 style="margin-top:20px; font-family: 'Fredoka';">Sweet Lily ☁️</h3>
                <div class="price-tag">16k</div>
            </div>

            <div class="card">
                <div class="image-box">
                    <img src="https://i.pinimg.com/736x/fc/3d/fa/fc3dfa0506512896c7b727c1005f2fa8.jpg" class="card-img">
                </div>
                <h3 style="margin-top:20px; font-family: 'Fredoka';">Tulip Clean 🌷</h3>
                <div class="price-tag">16k</div>
            </div>

            <div class="card">
                <div class="image-box">
                    <img src="https://i.pinimg.com/736x/a6/4e/7a/a64e7a1a2f6cce8486838b792d939c87.jpg" class="card-img">
                </div>
                <h3 style="margin-top:20px; font-family: 'Fredoka';">Jumbo Rosé 💖</h3>
                <div class="price-tag">70k</div>
            </div>
        </div>

        <section class="social-section">
            <h2 style="font-family: 'Fredoka'; color: var(--cute-pink); font-size: 2rem;">Mau Pesan? Hubungi Kami! ✨</h2>
            <div class="social-links">
                <a href="https://www.instagram.com/leonardrapiki/" class="social-btn" target="_blank">
                    <span>📸</span> INSTAGRAM
                </a>
                <a href="https://www.tiktok.com/@leonard2pac" class="social-btn" target="_blank">
                    <span>🎵</span> TIKTOK
                </a>
                <a href="https://wa.me/6282231235341" class="social-btn" target="_blank">
                    <span>💬</span> WHATSAPP
                </a>
            </div>
        </section>

        <footer>
            BY RIFKYC &bull; EST 2026 &bull; BLOOM WITH JOY
        </footer>
    </div>

    <script>
        // 1. Custom Cursor
        const cursor = document.getElementById('cursor-flower');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // 2. 3D Tilt Kartu (TETAP ADA)
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = (y - centerY) / 8;
                const rotateY = (centerX - x) / 8;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            });
        });

        // 3. Kelopak Jatuh
        function createPetal() {
            const petal = document.createElement('div');
            petal.innerHTML = ['🌸','🌷','✨','💖'][Math.floor(Math.random()*4)];
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.top = '-50px';
            petal.style.fontSize = Math.random() * 20 + 20 + 'px';
            petal.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), 5000);
        }
        setInterval(createPetal, 800);
    </script>
</body>
</html>
